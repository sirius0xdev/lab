apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate 
spec:
  schedule: "@hourly"
  concurrency: Forbid
  jobTemplate:
    spec: 
      containers:
        - name: renovate
          image: renovate/renovate:latest
          args:
            - sirius0xdev/lab 

          envFrom:
            - secretRef:
                name: renovate-container-env
            - configMapRef:
                name: renovate-configmap
      

      restartPolicy: Never
