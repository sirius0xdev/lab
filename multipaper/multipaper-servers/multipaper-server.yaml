apiVersion: apps/v1
kind: Deployment
metadata:
  name: multipaper-server-deployment
  namespace: minecraft
spec:
  replicas: 1 # Scale this out as needed
  selector:
    matchLabels:
      app: multipaper-server
  template:
    metadata:
      labels:
        app: multipaper-server
  
    spec:
      securityContext:
        runAsUser: 1000  # Common user ID for Minecraft images (check your image docs)
        runAsGroup: 1000 # Common group ID
        fsGroup: 1000
       
      initContainers:
      - name: copy-config
        image: busybox:1.36 # A minimal image with 'cp' command
        command: ["sh", "-c", "cp -R /configmap-source/* /writable-config/"]
        volumeMounts:
        - name: config-source # Mounts the ConfigMap data as read-only source
          mountPath: /configmap-source
        - name: config-writable # Mounts the EmptyDir/PVC as writable destination
          mountPath: /writable-config 
      
      containers:
      - name: server
        image: noevidenz/multipaper:1.20
        env:
        - name: EULA
          value: "true"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx1G -DmultipaperMasterAddress=master-headless:35353 -Dproperties.view-distance=16 -Dspigot.settings.bungeecord=true"
        volumeMounts:
          - name: config-writable 
            mountPath: /app/config
            

      volumes:     # Define the read-only ConfigMap source volume
        - name: config-source
          configMap:
           name: paper-global # The name of your ConfigMap
        
        # Define a writable volume (use EmptyDir for temporary config or PVC for permanent config)
        - name: config-writable
          emptyDir: {} # Temporary storage that dies with the pod
          # OR use a PVC like this if you want persistence:
          # persistentVolumeClaim:
          #   claimName: multipaper-config-pvc

