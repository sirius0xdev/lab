
apiVersion: v1
kind: Service
metadata:
  name: multipaper-loadbalancer 
  namespace: minecraft  
  labels:
    cilium-lb-pool: sirius-ippool
  annotations:
    lbipam.cilium.io/sharing-key: sirius-services
spec:
  type: LoadBalancer
  externalIPs:
    - "5.161.82.129"
  externalTrafficPolicy: Cluster
  selector:
    app: multipaper-master  
  ports:
    - name: proxy 
      protocol: TCP 
      port: 25565
      targetPort: 25565 
