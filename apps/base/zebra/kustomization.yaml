apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
secretGenerator:
  - name: zebra-secret-values
    namespace: zcash
    files:
      - values.yaml=my-values.enc.yaml
configurations:
  - kustomizeconfig.yaml

patches:
  - path: zebrad-statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: zcash-stack-zebra
      
