apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zcash-stack
  namespace: zcash 
spec:
  interval: 30m
  chart:
    spec:
      chart: zcash-stack 
      version: "^1.0.0"  
      

      sourceRef:
        kind: HelmRepository
        name: zcash-stack 
        namespace: zcash 
      interval: 12h
  
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  
  valuesFrom:
    - kind: Secret
      name: zcash-stack-secrets
      valuesKey: rpc-password
      targetPath: rpc.credentials.rpcPassword
    
    - kind: Secret
      name: zcash-stack-secrets
      valuesKey: rpc-password
      targetPath: rpc.credentials.rpcUser 

  values:
    nodeSelector:
      hostname: highpower
    dnsseeder.env.seedHostname: "sirius-sec.com"
    dnsseeder.env.nodeHostname: "zec.sirius-sec.com"
    dnsseeder.env.email: "sirius-sec@protonmail.com"
    zebra.volumes.data.storageClass: local-path
    lightwalletd.volumes.data.storageClass: local-path
    dnsseeder.image.repository: electriccoinco/dnsseeder 
    dnsseeder.image.tag: sha256:9f9ff41101dcfd26c222e51d48cf34a6dc9be918a1702174c9d54e54210c532d

