apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prosody-certs
  namespace: prosody # Or your application's namespace
spec:
  secretName: prosody-certs
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer # or Issuer
  commonName: "*.sirius-sec.com"
  dnsNames:
    - "*.sirius-sec.com"
    - "sirius-sec.com"
