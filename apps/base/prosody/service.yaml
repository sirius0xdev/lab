apiVersion: v1
kind: Service
metadata:
  name: prosody-service
  namespace: prosody

spec:
  type: ClusterIP
  selector:
    app: prosody
  ports:
    - protocol: TCP
      port: 5269
      targetPort: 5269
    - protocol: TCP
      port: 5222
      targetPort: 5222
    - protocol: TCP
      port: 5000
      targetPort: 5000
    - protocol: TCP 
      port: 5280
      targetPort: 5280
    - protocol: TCP 
      port: 5281
      targetPort: 5281

