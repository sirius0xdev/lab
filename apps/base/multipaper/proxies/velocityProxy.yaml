apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velocity-config-pvc
  namespace: minecraft 
spec:
  accessModes:
    - ReadWriteOnce  
  resources:
    requests:
      storage: 1Gi 
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velocity-plugins 
  namespace: minecraft 
spec:
  accessModes:
    - ReadWriteOnce  
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-proxy-deployment
  namespace: minecraft
  labels:
    app: velocity-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity-proxy
  template:
    metadata:
      labels:
        app: velocity-proxy
    spec:
     
      securityContext:
        runAsUser: 1000 
        runAsGroup: 1000
        fsGroup: 1000 # Ensures the PVC is owned by this group
      initContainers:
        - name: download-plugins
          image: curlimages/curl:latest # A minimal image with curl pre-installed
          command: ['sh', '-c', '
             curl -L "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity" -o /plugins/geyser.jar 
            ']
          volumeMounts:
            - name: velocity-plugins  
              mountPath: /plugins   


      containers:
      # ADD HYPHEN HERE TO INDICATE THE START OF THE LIST ITEM
      - name: velocity-proxy-container 
        image: itzg/mc-proxy:latest # A versatile image that supports Velocity
        ports:
        - containerPort: 25577 # Default proxy port for MC Java connections
          name: mc-java-tcp
          protocol: TCP
        
        - containerPort: 19132
          name: geyser
          protocol: UDP 
          
        env:
          - name: TYPE
            value: "VELOCITY" # Tells the Docker image to run Velocity
          - name: SERVER_PORT
            value: "25577"
          - name: SERVER_PORT
            value: "19132" 
          - name: MOTD
            value: "My Awesome MultiPaper Network"
        
        volumeMounts:
          
          - mountPath: /server 
            name: velocity-config-pvc
          
          
          - name: velocity-config
            mountPath: /config 
        
          - name: velocity-plugins
            mountPath: /plugins 
      
      volumes:
        - name: velocity-config-pvc  
          persistentVolumeClaim:
            claimName: velocity-config-pvc
     
        - name: velocity-plugins 
          persistentVolumeClaim:
            claimName: velocity-plugins 
          
        
      
        - name: velocity-config
          configMap:
            name: velocity-config
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: velocity-proxy-service
  namespace: minecraft
  labels:
    cilium-lb-pool: sirius-ippool 
  annotations:
    lbipam.cilium.io/sharing-key: sirius-services 
spec:
  type: LoadBalancer 
  externalIPs:
    - "5.161.82.129"
  selector:
    app: velocity-proxy
  ports:
    - protocol: TCP
      port: 25565 # The standard port external Java players use to connect
      targetPort: 25577 # The container port
      name: mc-java-tcp
    
    - protocol: UDP
      port: 19132
      targetPort: 19132
      name: geyser 
