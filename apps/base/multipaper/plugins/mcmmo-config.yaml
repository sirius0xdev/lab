    #
    # This file includes a few settings for each skill in mcMMO

    # Acrobatics
    Acrobatics:
        # turn this to false to disable all subskills for this skill
        Enabled: true
        Roll:
            Enabled: true
  custom_item_support.yml: |
    # This is meant to be a general config for allowing mcMMO to allow interaction with custom items.
    # In the future, I would like to add configs to be specific about certain custom items.
    # For now, support is generalized to whether the custom item has a custom model.
    # This is an easy solution to implement for now, but not the most ideal.
    Custom_Item_Support:
        Repair:
            # Turn this off to disable repair on any items with custom model data
            Allow_Repair_On_Items_With_Custom_Model_Data: true
        Salvage:
            # Turn this off to disable salvage on any items with custom model data
            Allow_Salvage_On_Items_With_Custom_Model_Data: true
  experience.yml: "# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarColor.html\n#
    These are the only valid colors for Experience Bars, use the exact name found
    here\n# BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW (As of the time of this
    update these are the only Bar colors available, this could change in the future
    so check the BarColor enum to see if it has)\n# BarStyle Settings (USE THE EXACT
    NAME) :\n# SEGMENTED_10\n#   Splits the boss bar into 10 segments\n# SEGMENTED_12\n#
    \  Splits the boss bar into 12 segments\n# SEGMENTED_20\n#   Splits the boss bar
    into 20 segments\n# SEGMENTED_6\n#   Splits the boss bar into 6 segments\n# SOLID\n#
    \  The bar is one solid piece\nEarlyGameBoost:\n    Enabled: true\nExploitFix:\n
    \   Combat:\n        XPCeiling:\n            Enabled: true\n            Damage_Limit:
    100\n    COTWBreeding: true\n    UnsafeEnchantments: false\n    # Prevent many
    exploits related to fishing\n    Fishing: true\n    EndermanEndermiteFarms: true\n
    \   Acrobatics: true\n    LavaStoneAndCobbleFarming: true\n    TreeFellerReducedXP:
    true\n    PistonCheating: true\n    SnowGolemExcavation: true\n    PreventArmorStandInteraction:
    true\n    PreventMannequinInteraction: true\n    # This include NPCs from stuff
    like Citizens, this is not a setting for Vanilla Minecraft Villagers (Which can
    be considered NPCs)\n    # mcMMO normally doesn't process attacks against an Entity
    if it is an NPC from another plugin\n    # Of course, mcMMO doesn't know for sure
    whether something is an NPC, it checks a few known things, see our source code
    to see how\n    PreventPluginNPCInteraction: true\n    # This will limit XP gained
    from unnaturally tall plants, like those created by Bone Meal\n    LimitTallPlantFarming:
    true\nFishing_ExploitFix_Options:\n    MoveRange: 3\n    OverFishLimit: 10\nExperience_Bars:\n
    \   # Turn this to false if you want to disable XP bars\n    Enable: true\n    Update:\n
    \       # XP that you gained from your party but not yourself\n        Party:
    true\n        # Passive is stuff like smelting, brewing\n        Passive: true\n
    \   # If you want to use a fancy edited title from the locale, then you'll probably
    want to turn this on, but it will make your server do a lot more work!\n    #
    I recommend leaving this off!\n    ThisMayCauseLag:\n        AlwaysUpdateTitlesWhenXPIsGained:\n
    \           Enable: false\n            # You can make your own custom details
    in the locale file without having to use the ExtraDetails setting!\n            ExtraDetails:
    false\n    Acrobatics:\n        Enable: true\n        Color: PINK\n        BarStyle:
    SEGMENTED_6\n    Alchemy:\n        Enable: true\n        Color: PURPLE\n        BarStyle:
    SEGMENTED_6\n    Archery:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Axes:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Crossbows:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Excavation:\n        Enable: true\n        Color: YELLOW\n        BarStyle:
    SEGMENTED_6\n    Fishing:\n        Enable: true\n        Color: PURPLE\n        BarStyle:
    SEGMENTED_6\n    Herbalism:\n        Enable: true\n        Color: GREEN\n        BarStyle:
    SEGMENTED_6\n    Mining:\n        Enable: true\n        Color: YELLOW\n        BarStyle:
    SEGMENTED_6\n    Maces:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Spears:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Repair:\n        Enable: true\n        Color: PURPLE\n        BarStyle:
    SEGMENTED_6\n    Salvage:\n        Enable: true\n        Color: PURPLE\n        BarStyle:
    SEGMENTED_6\n    Smelting:\n        Enable: true\n        Color: PURPLE\n        BarStyle:
    SEGMENTED_6\n    Swords:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Taming:\n        Enable: true\n        Color: RED\n        BarStyle:
    SEGMENTED_6\n    Tridents:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Unarmed:\n        Enable: true\n        Color: BLUE\n        BarStyle:
    SEGMENTED_6\n    Woodcutting:\n        Enable: true\n        Color: GREEN\n        BarStyle:
    SEGMENTED_6\n#\n#  Settings for XP formula\n# ##\nExperience_Formula:\n    # Valid
    values are: LINEAR and EXPONENTIAL\n    # If an invalid value is entered, this
    will reset to the default setting, which is LINEAR\n    # LINEAR:      base +
    (level * multiplier)\n    # EXPONENTIAL: multiplier * level ^ exponent + base\n
    \   Curve: LINEAR\n    \n    # If invalid values are entered mcMMO will not start
    and print an error in the console\n    Linear_Values:\n        base: 1020\n        multiplier:
    20\n    Exponential_Values:\n        multiplier: 0.1\n        exponent: 1.8\n
    \       base: 2000\n    \n    # Cumulative experience curves will use a players
    power level instead of their skill level,\n    # players with high power levels
    will have to gain a lot more experience to reach the next level in every skill.\n
    \   Cumulative_Curve: false\n    \n    # Experience gained in every skill will
    get multiplied by this value. 1.0 by default, 2.0 means two times as much\n    Multiplier:\n
