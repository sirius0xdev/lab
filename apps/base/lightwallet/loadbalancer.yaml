
apiVersion: v1
kind: Service
metadata:
  name: lightwalletd-rpc
  namespace: zcash 
spec:
  # Use Cilium's L2 announcer load balancer class
  loadBalancerClass: io.cilium/l2-announcer
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: zcash-stack-lightwalletd  # Matches the labels on your Prosody StatefulSet pods
  ports:
    - name: rpc 
      protocol: TCP
      port: 443
      targetPort: 9067
