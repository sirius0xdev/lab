apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zcash-stack-lightwalletd
  namespace: zcash
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: zcash-stack-lightwalletd
  serviceName: ""
  template:
    metadata:
      labels:
        app: zcash-stack-lightwalletd
    spec:
      containers:
      - args:
        - --tls-cert
        - "/srv/lightwalletd/certs/tls.crt"
        - --tls-key
        - "/srv/lightwalletd/certs/tls.key"
        - --grpc-bind-addr
        - "0.0.0.0:9067"
        - --zcash-conf-path
        - "/srv/lightwalletd/conf/zcash.conf"
        - --data-dir
        - "/srv/lightwalletd/db_volume"
        - --log-file
        - "/dev/stdout"
        - --donation-address
        - " u1par8vw6kgw9e49wv0vy5cara56460nek4gc6ngruht8pt9l3j8j8cn9az35cuqr8rv2rsdt04esw8fxkj0xs9zx2ntluspapgga6qpsk9rr9narl9urx23ln6fwmgt5mr6jz7wlhj9hrwxuvafvhhtxsnt9r0jfd9lujf20kcsp9dk67 "
        command:
        - lightwalletd
        
        image: electriccoinco/lightwalletd:latest
        imagePullPolicy: IfNotPresent
        name: lightwalletd
        
        ports:
        
        - containerPort: 9067
          name: grpc
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 9067
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9067
          initialDelaySeconds: 60
          periodSeconds: 30
        
        resources:
          requests:
            cpu: "0"
            memory: "0"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        
        volumeMounts:
        
        - mountPath: /srv/lightwalletd/db_volume
          name: lightwalletd-data
        
        - mountPath: /srv/lightwalletd/conf
          name: config
        
        - mountPath: /srv/lightwalletd/certs 
          name: lightwallet-certs 
      
      dnsPolicy: ClusterFirstWithHostNet 
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      
      volumes:
  
      - configMap: 
          defaultMode: 420
          name: config  
        name: config 
      
      - secret:
         secretName: lightwallet-certs
         defaultMode: 420
        name: lightwallet-certs 
  
      - name: lightwalletd-data 
        persistentVolumeClaim:
            claimName: lightwalletd-data 
  
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: lightwalletd-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 200Gi
      storageClassName: local-path
      volumeMode: Filesystem
