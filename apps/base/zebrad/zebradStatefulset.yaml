apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
  name: zebrad 
  namespace: zcash
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: zcash-stack-zebra
  serviceName: ""
  template:
    metadata:
      labels:
        app: zcash-stack-zebra
    spec:
      containers:
        image: zfnd/zebra:latest
        imagePullPolicy: IfNotPresent
        name: zebra
        ports:
        - containerPort: 8232
          name: zebra-rpc
          protocol: TCP
        - containerPort: 8233
          name: zebra-p2p
          protocol: TCP
        resources:
          requests:
            cpu: "0"
            memory: "0"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        
        env:
          - name: ZEBRA_CONF_PATH
            value: /etc/zebrad/zebrad.toml 
        
        volumeMounts:
        - mountPath: /var/cache/zebrad-cache
          name: zebra-data
        - mountPath: /etc/zebrad
          name: zebrad-config
        - mountPath: /data
          name: zebra-data
      volumes:
        - name: zebrad-config
          configmap:
            name: zebrad-config   
            defaultMode: 0444
      dnsPolicy: ClusterFirst
      
      initContainers:
      - args:
        - chown -R 2001 /data
        command:
        - /bin/bash
        - -c
        image: debian
        imagePullPolicy: Always
        name: set-permissions
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: zebra-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 400Gi
      storageClassName: local-path
      volumeMode: Filesystem
