apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: zebrad
  name: zebrad 
  namespace: zcash
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: zebrad 
  serviceName: ""
  template:
    metadata:
      labels:
        app: zebrad
    spec:
      containers:
        - image: zfnd/zebra:latest
          imagePullPolicy: IfNotPresent
          name: zebrad 
          command: ["zebrad"]
          args: ["--config", "/etc/zebrad/zebrad.toml"]
          ports:
          - containerPort: 8232
            name: zebrad-rpc 
            protocol: TCP
          - containerPort: 8233
            name: zebrad-p2p 
            protocol: TCP
          resources:
            requests:
            cpu: "0"
            memory: "0"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        
        
          volumeMounts:
          - mountPath: /var/cache/zebrad-cache
            name: zebra-data
          - mountPath: /etc/zebrad
            name: zebrad-config
      volumes:
        - name: zebrad-config
          configMap:
            name: zebrad-config   
            defaultMode: 0444
      dnsPolicy: ClusterFirst
      
      initContainers:
      - args:
        - mkdir /var/cache/zebrad-cache && chown -R 2001 /var/cache/zebrad-cache
        command:
        - /bin/bash
        - -c
        





        image: debian
        imagePullPolicy: Always
        name: set-permissions
        resources: {}
        securityContext:
          runAsUser: 0

        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: zebra-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 400Gi
      storageClassName: local-path
      volumeMode: Filesystem
