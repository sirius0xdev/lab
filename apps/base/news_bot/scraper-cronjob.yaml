
apiVersion: batch/v1
kind: CronJob 
metadata:
  name: news-scraper
  namespace: newsbot
spec:
  schedule: "50 * * * *"
  jobTemplate:
    spec:
      template:
        spec: 
          containers:
          - name: news-scraper
            image: siriussec/newsscraper:0.5.4 
            imagePullPolicy: "Always"
            
            resources:
              requests:
                memory: "1Gi"
                cpu: "100m"
              limits:
                memory: "2Gi"
                cpu: "500m"
            envFrom:
            - configMapRef:
                name: scrapy-config
            env:
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: news-db-secret  
                    key: password 
            volumeMounts:
              - name: url-storage
                mountPath: /app/urls.txt
                subPath: urls.txt
              
              - mountPath: /dev/shm
                name: dshm 
          volumes:
            - name: url-storage
              configMap:
                name: scrapy-urls 
            - name: dshm
              emptyDir:
                medium: Memory 
          restartPolicy: OnFailure       
          
