apiVersion: v1
kind: ConfigMap
metadata:
  name: scrapy-config
  namespace: newsbot 
data:
  # Database Connection
  DB_HOST: "newsbot-db-1"

  DB_NAME: "news_app_db"
  DB_USER: "news_app"
  DB_PORT: "5432"
  
  # Scrapy Settings
  LOG_LEVEL: "WARNING"
  USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) NewsScraper/1.0"
  CONCURRENT_REQUESTS: "150"
  # Proxy Endpoint (The URL part only)
  PROXY_ENDPOINT: ""
